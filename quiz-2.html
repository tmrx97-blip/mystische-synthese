<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jubiläum">
    <title>Das ultimative Jubiläums-Quiz</title>
    <style>
        :root {
            --primary: #007aff;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: env(safe-area-inset-top) 20px 40px;
        }
        .container { max-width: 500px; width: 100%; margin-top: 40px; }
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.5px; }
        p.subtitle { color: #86868b; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #86868b; margin-bottom: 8px; margin-left: 4px; }
        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            background: #fbfbfd;
            font-size: 17px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary); }
        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .hidden { display: none; }
        .stat-val { font-size: 48px; font-weight: 800; color: var(--primary); margin: 20px 0; }
        .stat-desc { font-size: 18px; line-height: 1.5; color: #3a3a3c; }
        .progress-bar { height: 6px; background: #e5e5ea; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <div id="step-start" class="card">
            <h1>Jubiläums-Check 🎊</h1>
            <p class="subtitle">Bereit für die nackte Wahrheit?</p>
            <div class="input-group">
                <label>Vorname Jubilar/in</label>
                <input type="text" id="name" placeholder="z.B. Maria">
            </div>
            <div class="input-group">
                <label>Geburtsdatum</label>
                <input type="date" id="birthdate">
            </div>
            <div class="input-group">
                <label>Jahre im Betrieb / Jubiläum</label>
                <input type="number" id="jubi-years" placeholder="z.B. 25">
            </div>
            <button class="btn" onclick="startQuiz()">Quiz starten</button>
        </div>

        <div id="step-quiz" class="card hidden">
            <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
            <div id="quiz-content">
                <h2 id="question-title">Frage</h2>
                <div id="stat-value" class="stat-val">0</div>
                <p id="stat-text" class="stat-desc"></p>
                <button class="btn" style="margin-top: 30px;" id="next-btn" onclick="nextStep()">Nächste Erkenntnis</button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        let data = {};
        const steps = [];

        function startQuiz() {
            const name = document.getElementById('name').value;
            const bday = new Date(document.getElementById('birthdate').value);
            const years = parseInt(document.getElementById('jubi-years').value);

            if (!name || isNaN(bday) || isNaN(years)) {
                alert("Bitte fülle alle Felder aus!");
                return;
            }

            const now = new Date();
            const diffDays = Math.floor((now - bday) / (1000 * 60 * 60 * 24));
            
            data = { name, diffDays, years };

            // Quiz Inhalte generieren
            steps.push({
                title: `Hey ${name}, weißt du wie lange du schon auf diesem Planeten bist?`,
                val: `${data.diffDays.toLocaleString()} Tage`,
                text: "Das sind eine Menge Sonnenaufgänge. Davon hast du vermutlich die Hälfte verschlafen und die andere Hälfte nach Kaffee gesucht."
            });
            steps.push({
                title: "Dein Kaffee-Konsum im Dienst...",
                val: `${(years * 220 * 3).toLocaleString()} Tassen`,
                text: `In deinen ${years} Dienstjahren hast du bei ca. 3 Tassen täglich ganze Ozeane an Koffein geleert. Respekt an deine Blase!`
            });
            steps.push({
                title: "Meetings & Termine",
                val: `${(years * 48).toLocaleString()} Stunden`,
                text: "So viel Zeit hast du in etwa damit verbracht, in Meetings zu sitzen und dich zu fragen, was es wohl heute in der Kantine zu essen gibt."
            });
            steps.push({
                title: "Die 'Das machen wir so wie immer' Quote",
                val: `${(years * 12).toLocaleString()} Mal`,
                text: "Statistisch gesehen hast du diesen Satz mindestens einmal pro Monat gesagt. Ein wahrer Klassiker der Beständigkeit!"
            });

            document.getElementById('step-start').classList.add('hidden');
            document.getElementById('step-quiz').classList.remove('hidden');
            showStep();
        }

        function showStep() {
            const step = steps[currentStep];
            document.getElementById('question-title').innerText = step.title;
            document.getElementById('stat-value').innerText = step.val;
            document.getElementById('stat-text').innerText = step.text;
            document.getElementById('progress').style.width = ((currentStep + 1) / steps.length * 100) + "%";
            
            if (currentStep === steps.length - 1) {
                document.getElementById('next-btn').innerText = "Fertig & Neustart";
            }
        }

        function nextStep() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                showStep();
            } else {
                location.reload(); // Einfacher Neustart
            }
        }
    </script>
</body>
</html>

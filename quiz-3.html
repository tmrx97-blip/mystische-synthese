<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Das Große Lebens-Quiz</title>
    
    <style>
        :root { --apple-blue: #007AFF; --apple-gray: #F2F2F7; --gold: #D4AF37; }
        body { font-family: -apple-system, sans-serif; background-color: var(--apple-gray); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #app { background: white; width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h1 { color: #333; font-size: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--apple-blue); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px; }
        .result-box { font-size: 2rem; font-weight: 800; color: var(--apple-blue); margin: 20px 0; }
        .fun-fact { font-style: italic; background: #fff9e6; padding: 15px; border-radius: 10px; border-left: 5px solid var(--gold); margin-top: 20px; font-size: 0.9rem; color: #444; }
        .progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: var(--apple-blue); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="app">
    <div id="progressContainer" style="display:none;"><div class="progress-bar"><div class="progress-fill" id="progress"></div></div></div>

    <div id="screen-start" class="screen active">
        <h1>Dein Lebens-Check</h1>
        <p>Wann ging die Reise los und wo?</p>
        <input type="date" id="inputDate" value="1990-01-01">
        <input type="text" id="inputCity" placeholder="Stadt (z.B. Erfurt)">
        <button onclick="startQuiz()">Quiz starten</button>
    </div>

    <div id="screen-quiz" class="screen">
        <h2 id="questionTitle">Frage</h2>
        <div id="questionText">Text</div>
        <div class="result-box" id="resultValue">--</div>
        <div class="fun-fact" id="funFact">Erklärung</div>
        <button onclick="nextQuestion()">Weiter</button>
    </div>

    <div id="screen-end" class="screen">
        <h1>Fertig!</h1>
        <p>Du bist ein echtes statistisches Wunderwerk!</p>
        <button onclick="location.reload()">Neustart</button>
    </div>
</div>

<script>
    let currentStep = 0;
    let days = 0;
    let city = "";

    const questions = [
        {
            title: "Nachwuchs",
            text: (c) => `Wie viele neue Erdenbürger sind in <strong>${c}</strong> seitdem geschlüpft?`,
            calc: (d) => Math.round(d * 0.022).toLocaleString() + " Babys",
            fact: (d) => `Wusstest du, dass Babys am Anfang 300 Knochen haben? Du hast also im Laufe der Zeit ca. 94 Knochen 'wegrationalisiert'.`
        },
        {
            title: "Sonnenstunden",
            text: (c) => `Wie viele Stunden hat die Sonne in <strong>${c}</strong> seitdem extra für dich Überstunden gemacht?`,
            calc: (d) => Math.round(d * 4.4).toLocaleString() + " Std.",
            fact: (d) => `Genug Licht, um theoretisch eine Million Solartaschenrechner gleichzeitig zu betreiben.`
        },
        {
            title: "Schnee-Chaos",
            text: (c) => `Wenn jede Flocke, die seitdem in <strong>${c}</strong> fiel, liegen geblieben wäre: Wie hoch müsstest du dich ausgraben?`,
            calc: (d) => (d * 0.00137).toFixed(1) + " Meter",
            fact: (d) => `Das entspricht etwa der Höhe eines Brachiosaurus. Stell dir den mal im Vorgarten vor!`
        },
        {
            title: "Die neue Haut",
            text: () => `In der wievielten Haut steckst du heute eigentlich?`,
            calc: (d) => Math.round(d / 27) + ". Haut",
            fact: (d) => `Du hast in dieser Zeit ca. ${(d * 0.01).toFixed(1)} kg Hautschuppen verloren. Ein Festmahl für jede Milbe!`
        },
        {
            title: "Blinzel-Marathon",
            text: () => `Wie oft haben deine Augenlider seitdem 'Guten Tag' gesagt?`,
            calc: (d) => (d * 0.015).toFixed(1) + " Mio. Mal",
            fact: (d) => `Deine Lider haben dabei eine Strecke zurückgelegt, die für einen Spaziergang nach Berlin reichen würde.`
        },
        {
            title: "Herz-Kran-Leistung",
            text: () => `Wenn dein Herz ein Baukran wäre: Wie hoch hätte es einen 1,5-Tonnen-Wagen gehievt?`,
            calc: (d) => Math.round(d * 5.8).toLocaleString() + " Meter",
            fact: (d) => `Das ist höher als die Reiseflughöhe eines Jets. Dein Herz ist ein echter Hochleistungs-Bizeps.`
        },
        {
            title: "Atemzüge",
            text: () => `Wie viele Millionen Liter Luft hast du schon ausgeatmet?`,
            calc: (d) => (d * 0.0086).toFixed(1) + " Mio. Liter",
            fact: (d) => `Das reicht, um ca. ${Math.round(d * 0.003)} Heißluftballons prall zu füllen. Eine kleine Luftflotte!`
        },
        {
            title: "Achselhaar-Urwald",
            text: () => `Wenn du deine Achselhaare nie rasiert hättest: Wie lang wäre der Wildwuchs?`,
            calc: (d) => (d * 0.038).toFixed(1) + " cm",
            fact: (d) => `Lang genug, um sie zu Zöpfen zu flechten und als modisches Accessoire zu tragen.`
        },
        {
            title: "Die Bratwurst-Kette",
            text: () => `Wie viele Meter lang wäre die Kette aus Thüringer Rostbratwürsten, die DU allein verputzt hast?`,
            calc: (d) => Math.round(d * 0.02).toLocaleString() + " Meter",
            fact: (d) => `Das sind ca. ${Math.round(d / 10)} Würste. Der Senfverbrauch füllt vermutlich einen Eimer!`
        },
        {
            title: "Pipi-Power",
            text: () => `Wie viele Badewannen hättest du mit deinem 'Pipi' seitdem gefüllt?`,
            calc: (d) => Math.round(d * 1.5 / 150).toLocaleString() + " Wannen",
            fact: (d) => `Du bist ein wandelnder Hydrant. Rein rechnerisch könntest du damit einen kleinen Dorfbrunnen betreiben.`
        },
        {
            title: "Die Pups-Hülle",
            text: () => `Wie groß wäre ein Ballon, gefüllt mit all deinen Winden?`,
            calc: (d) => (d * 1.2).toFixed(0) + " Liter Gas",
            fact: (d) => {
                const liters = d * 1.2;
                if(liters > 10000) return `Das sind ca. ${(liters/1000).toFixed(1)} m³ – das Volumen eines ganzen Transporters!`;
                return `Das passt in einen kleinen PKW. Eine mobile Gaskammer der heiteren Art!`;
            }
        },
        {
            title: "Das Rülps-Orchester",
            text: () => `Wie viele Düsenjets würdest du mit all deinen Rülpsern übertönen?`,
            calc: (d) => Math.round(d / 4).toLocaleString() + " Jets",
            fact: (d) => `Dein Magen ist ein echtes Sound-System. In Erfurt würde man dich am Domplatz hören!`
        },
        {
            title: "Die Spucke-Oase",
            text: () => `Hättest du mit deiner Speichelproduktion eine Wüstenoase bewässert?`,
            calc: (d) => (d * 1.0).toLocaleString() + " Liter",
            fact: (d) => `Das reicht für ${Math.round(d / 20)} m² blühenden Garten. Dein Mund ist quasi eine biologische Sprinkleranlage.`
        },
        {
            title: "Die Mond-Reise",
            text: () => `Wie viel Prozent der Strecke zum Mond hättest du bereits zurückgelegt?`,
            calc: (d) => (d * 3.5 / 384400 * 100).toFixed(1) + " %",
            fact: (d) => `Für einen 35-jährigen Profi sind das ca. 45.000 km – also einmal komplett um die Welt!`
        },
        {
            title: "Gedanken-Gewitter",
            text: () => `Wie viele 60-Watt-Glühbirnen hätte dein Gehirn für eine Stunde leuchten lassen können?`,
            calc: (d) => Math.round(d * 480 / 60).toLocaleString() + " Birnen",
            fact: (d) => `Dein Kopf ist ein Kraftwerk! Die meiste Energie verbrauchen wir zum Glück für kreativen Unsinn.`
        }
    ];

    function startQuiz() {
        const dVal = document.getElementById('inputDate').value;
        if(!dVal) return;
        days = Math.ceil(Math.abs(new Date() - new Date(dVal)) / (1000 * 60 * 60 * 24));
        city = document.getElementById('inputCity').value || "Erfurt";
        document.getElementById('screen-start').classList.remove('active');
        document.getElementById('screen-quiz').classList.add('active');
        document.getElementById('progressContainer').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentStep];
        document.getElementById('questionTitle').innerText = q.title;
        document.getElementById('questionText').innerHTML = q.text(city);
        document.getElementById('resultValue').innerText = q.calc(days);
        document.getElementById('funFact').innerText = (typeof q.fact === 'function') ? q.fact(days) : q.fact;
        document.getElementById('progress').style.width = ((currentStep + 1) / questions.length * 100) + "%";
    }

    function nextQuestion() {
        currentStep++;
        if(currentStep < questions.length) showQuestion();
        else {
            document.getElementById('screen-quiz').classList.remove('active');
            document.getElementById('screen-end').classList.add('active');
            document.getElementById('progressContainer').style.display = 'none';
        }
    }
</script>
</body>
</html>

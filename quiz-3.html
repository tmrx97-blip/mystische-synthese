<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Der Lebens-Check</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LebensCheck">
    
    <style>
        :root { --primary: #2c3e50; --accent: #d35400; --bg: #fdf2e9; --card-bg: #ffffff; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg); color: var(--primary); margin: 0; display: flex; justify-content: center; padding: env(safe-area-inset-top) 20px; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 30px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); margin-top: 40px; text-align: center; }
        h1 { font-size: 26px; color: var(--accent); }
        .input-group { margin: 20px 0; text-align: left; }
        input, select { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 15px; font-size: 16px; -webkit-appearance: none; }
        .btn-stack { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 2; background: var(--accent); color: white; border: none; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 15px; cursor: pointer; }
        button.back { flex: 1; background: #bdc3c7; }
        .result-val { font-size: 32px; font-weight: 800; color: var(--accent); display: block; margin: 15px 0; }
        .explanation { background: #f9f9f9; padding: 15px; border-left: 5px solid var(--accent); border-radius: 10px; text-align: left; font-size: 15px; line-height: 1.4; font-style: italic; }
        .quiz-step { display: none; }
        .quiz-step.active { display: block; animation: slide 0.4s ease-out; }
        @keyframes slide { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<div class="container">
    <div id="step-0" class="quiz-step active">
        <h1>Der Lebens-Check</h1>
        <p>Basierend auf den Werken von Giulia Enders & echten Daten.</p>
        <div class="input-group"><label>Geburtsdatum:</label><input type="date" id="birthdate" value="1970-01-01"></div>
        <div class="input-group">
            <label>Ort:</label>
            <select id="location">
                <option value="Jena">Jena</option>
                <option value="Erfurt">Erfurt</option>
                <option value="Gera">Gera</option>
                <option value="Brotterode">Brotterode</option>
            </select>
        </div>
        <button onclick="startQuiz()">Check starten</button>
    </div>
    <div id="quiz-container"></div>
</div>

<script>
    let userData = { days: 0, years: 0, loc: '', date: null };
    let currentStep = 1;

    const birthDb = {
        Jena: { p1: 1700, p2: 650, p3: 1350 },
        Erfurt: { p1: 2800, p2: 1100, p3: 2100 },
        Gera: { p1: 1600, p2: 450, p3: 850 },
        Brotterode: { p1: 75, p2: 25, p3: 45 }
    };

    function startQuiz() {
        const bdate = new Date(document.getElementById('birthdate').value);
        userData.days = Math.floor((new Date() - bdate) / 86400000);
        userData.years = userData.days / 365.25;
        userData.loc = document.getElementById('location').value;
        userData.date = bdate;
        renderStep(1);
    }

    function getStepData(step) {
        const d = userData.days; const y = userData.years; const loc = userData.loc;
        let res = "", exp = "";

        switch(step) {
            case 1:
                let total = 0; let sY = userData.date.getFullYear();
                for(let i=sY; i<=2026; i++) {
                    let db = birthDb[loc];
                    total += (i<1990) ? db.p1 : (i<2000 ? db.p2 : db.p3);
                }
                res = Math.floor(total).toLocaleString() + " Babys";
                exp = `In ${loc} war ganz schön was los! Wusstest du, dass unser Darm schon als Baby lernt, Freund von Feind zu unterscheiden? Ein riesiges Training für das Immunsystem!`;
                break;
            case 2:
                res = Math.floor(y * 1650).toLocaleString() + " Stunden";
                exp = "Die Sonne hilft uns, Vitamin D zu bilden. Das ist wie Treibstoff für deine Knochen und deine Laune. Dein Darm freut sich auch, wenn du entspannt in der Sonne sitzt!";
                break;
            case 3:
                let rinder = (y * 60) / 250; let eles = (d * 0.968) / 5000;
                res = `${rinder.toFixed(1)} Rinder ODER ${eles.toFixed(1)} Elefanten`;
                exp = `Was für eine Masse! Und stell dir jetzt bitte nicht vor, wie der Elefant wieder rauskommt... Giulia Enders sagt: Unser Darm hat eine Fläche so groß wie ein halbes Badmintonfeld, um all das zu verarbeiten!`;
                break;
            case 4:
                res = Math.floor(d / 28).toLocaleString() + ". Haut";
                exp = "Alle 4 Wochen bist du neu! Deine Haut und dein Darm arbeiten eng zusammen. Wenn der Darm grummelt, sieht man das oft im Gesicht. Wahre Schönheit kommt von den Zotten!";
                break;
            case 5:
                let hM = (d * 131000) / (1500 * 9.81); let eiffel = hM / 330;
                res = `${Math.floor(hM).toLocaleString()} Meter`;
                exp = `Das wären ca. ${eiffel.toFixed(1)} Mal den Eiffelturm rauf und mit dem Fahrstuhl wieder runter! Das Herz ist laut Jill Enders ein 'Beziehungsorgan' – es reagiert auf jedes Gefühl im Bauch.`;
                break;
            case 6:
                let bal = (d * 1440 * 8.5) / 3000000;
                res = `${bal.toFixed(1)} Heißluftballons`;
                exp = "Deine Lunge hat ausgebreitet die Fläche eines Squash-Spielfelds. Atmen ist die Brücke zwischen dem, was wir kontrollieren können, und dem, was unser Körper allein macht.";
                break;
            case 7:
                let distKm = 16200; let totalKm = d * 3.5; let rounds = totalKm / distKm;
                res = `${Math.floor(totalKm).toLocaleString()} km (${rounds.toFixed(1)} Mal)`;
                exp = `Du bist quasi von ${loc} bis nach Australien gelaufen! Deine Füße haben tausende Nervenenden, die deinem Hirn ständig sagen, wo es langgeht. Ein Wunderwerk der Statik!`;
                break;
            case 8:
                res = (d * 0.03).toFixed(1) + " cm";
                exp = "Über 6 Meter Wildwuchs! Haare sind biologisch gesehen Anhängsel, aber sie zeigen uns, wie gut unser Stoffwechsel arbeitet. Ein gesunder Darm sorgt für glänzende Pracht.";
                break;
            case 9:
                let m = (y * 52 * 0.7) * 0.2;
                res = `${Math.floor(m).toLocaleString()} Meter`;
                exp = "Eine Kette aus Thüringer Gold! Wusstest du, dass die Verdauung schon im Mund beginnt? Speichel ist wie ein kleiner Zaubertrank, der die erste Analyse der Wurst übernimmt.";
                break;
            case 10:
                res = Math.floor((d * 1.5) / 150) + " Badewannen";
                exp = "Deine Nieren filtern dein Blut ununterbrochen. Sie sind die Meister der Chemie im Hintergrund. Pipi ist eigentlich nur sehr sauber filtriertes Blutwasser!";
                break;
            case 11:
                res = (d * 0.001).toFixed(1) + " m³";
                exp = "Ein stattlicher Gasballon! Giulia Enders erklärt herrlich: Pupsen ist ein Zeichen dafür, dass deine Bakterien hart arbeiten und gesundes Zeug zerlegen. Ein Lob dem Mikrobiom!";
                break;
            case 12:
                let jets = (10 * Math.log10((d * 1.2) * 1e10)) / 140;
                res = `${jets.toFixed(1)} Düsenjets`;
                exp = "Ein Mammut-Rülps! Rülpsen ist einfach nur Luft, die den falschen Ausgang genommen hat. In 'Darm mit Charme' lernen wir: Unser Magen hat ein tolles Ventil-System.";
                break;
            case 13:
                let qm = d / 20; let txt = (qm < 150) ? "Vorgarten" : (qm < 2500 ? "Oase" : "Stadtpark");
                res = `Eine blühende ${txt}!`;
                exp = `Dein Speichel schützt deine Zähne und bereitet das Essen vor. Ohne ihn könnten wir gar nicht schmecken, was wir essen. Er ist der Butler deines Magens!`;
                break;
        }
        return { res, exp };
    }

    function renderStep(step) {
        if(step < 1) return;
        currentStep = step;
        const data = getStepData(step);
        const questions = ["", 
            "Wie viele neue Erdenbürger sind in [Ort] seit deiner Geburt geschlüpft?",
            "Wie viele Sonnenstunden hat die Sonne seitdem extra für dich gemacht?",
            "Wie viele Rinder ODER Elefanten hast du wohl verspeist? Nimm, was du lieber magst...",
            "Du häutest dich fortlaufend. In der wievielten Haut steckst du heute?",
            "Wenn dein Herz ein Baukran wäre: Wie hoch hätte es einen 1,5-Tonnen-Wagen gehievt?",
            "Wie vielen Heißluftballons entspricht dein verarbeitetes Atemluftvolumen?",
            "Wie oft hättest du die Strecke von Thüringen bis Australien (16.200km) schon geschafft?",
            "Wie viele Zentimeter Wildwuchs hättest du unter den Achseln (ohne Rasur)?",
            "Wie viele Meter lang wäre die Kette aus Thüringer Bratwürsten, die du verputzt hast?",
            "Wie viele Badewannen hättest du mit deinem Pipi seitdem gefüllt?",
            "Wie groß (m³) wäre der Ballon, wenn man all deine Winde gesammelt hätte?",
            "Wie viele Düsenjets würdest du mit einem gebündelten Mammut-Rülps übertönen?",
            "Vorgarten, Oase oder Stadtpark: Was hättest du mit deinem Speichel bewässert?"
        ];

        document.getElementById('step-0').classList.remove('active');
        document.getElementById('quiz-container').innerHTML = `
            <div class="quiz-step active">
                <p><strong>Frage ${step} von 13</strong></p>
                <p>${questions[step].replace("[Ort]", userData.loc)}</p>
                <span class="result-val">${data.res}</span>
                <div class="explanation">${data.exp}</div>
                <div class="btn-stack">
                    <button class="back" onclick="${step === 1 ? 'location.reload()' : 'renderStep('+(step-1)+')'}">Zurück</button>
                    <button onclick="${step === 13 ? 'location.reload()' : 'renderStep('+(step+1)+')'}">${step === 13 ? 'Neustart' : 'Weiter'}</button>
                </div>
            </div>
        `;
    }
</script>
</body>
</html>
